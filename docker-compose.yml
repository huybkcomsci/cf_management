version: "3.8"

services:
  # PostgreSQL database (Supabase replacement for local testing)
  postgres:
    image: postgres:16-alpine
    container_name: cafe-management-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cafemanagement
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cafe-network

  # ASP.NET Core Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cafe-management-app
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      CONNECTION_STRING: "Host=postgres;Port=5432;Database=cafemanagement;Username=postgres;Password=postgres;SSL Mode=Disable;Pooling=true;MaxPoolSize=20"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cafe-network
    restart: unless-stopped

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cafe-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cafe.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - cafe-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  cafe-network:
    driver: bridge
